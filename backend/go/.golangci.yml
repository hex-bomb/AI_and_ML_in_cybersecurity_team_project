# Линтер Go-модуля.
#
# Ключевое правило — запрет проникновения между слоями clean architecture:
# домен не знает ни о ком, application знает только о домене, delivery и
# infrastructure знают о домене и application, но не друг о друге. Без
# этого правила слои разъезжаются уже ко второму этапу, и переезд на Go
# заканчивается двумя монолитами вместо трёх слоёв.
#
# Правило проверяется дважды: этим линтером (быстро, в редакторе) и тестом
# internal/arch/layers_test.go (обязательно в CI — он не зависит от версии
# golangci-lint и от схемы конфига).
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - depguard
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - bodyclose
    - errorlint
    - copyloopvar
    - misspell
  settings:
    depguard:
      rules:
        # Слои по схеме развёртывания (kb-architecture.drawio, стр. 2):
        #   L1 транспорт  → internal/api, cmd/kb
        #   L2 use-cases  → internal/{ingest,search,access,docs,jobs}
        #   L3 порты      → internal/ports
        #   L4 адаптеры   → internal/store/*
        #   домен         → internal/envelope
        # Импорт адаптера в домен означает, что бизнес-правило уехало в
        # реализацию, и его больше нельзя подменить заглушкой в тесте.

        # Домен — чистый: типы-значения, инварианты, ошибки.
        envelope:
          files:
            - "**/internal/envelope/**"
          deny:
            - pkg: github.com/kbsearch/kb/internal/store
              desc: "envelope не зависит от store: порты объявляются здесь, реализации — там"
            - pkg: github.com/kbsearch/kb/internal/ingest
              desc: "envelope не зависит от use-case слоёв: это нижний слой"
            - pkg: github.com/kbsearch/kb/internal/search
              desc: "envelope не зависит от use-case слоёв"
            - pkg: github.com/kbsearch/kb/internal/access
              desc: "envelope не зависит от use-case слоёв"
            - pkg: github.com/kbsearch/kb/internal/docs
              desc: "envelope не зависит от use-case слоёв"
            - pkg: github.com/kbsearch/kb/internal/jobs
              desc: "envelope не зависит от use-case слоёв"
            - pkg: github.com/kbsearch/kb/internal/ports
              desc: "envelope объявляет типы сам; порты описывают то, что снаружи"
            - pkg: github.com/kbsearch/kb/internal/api
              desc: "envelope не зависит от транспорта"
            - pkg: github.com/knights-analytics/hugot
              desc: "envelope объявляет порт Embedder; ONNX-инференс — за его пределами"
            - pkg: github.com/elastic/go-elasticsearch
              desc: "envelope объявляет порт SearchIndex; клиент Elasticsearch — адаптер"
            - pkg: github.com/jackc/pgx
              desc: "envelope объявляет репозитории; pgx — адаптер"

        # Порты — контракты между слоями: ни реализаций, ни потребителей.
        ports:
          files:
            - "**/internal/ports/**"
          deny:
            - pkg: github.com/kbsearch/kb/internal/store
              desc: "порт описывает контракт; его реализация живёт в store"
            - pkg: github.com/kbsearch/kb/internal/api
              desc: "порт не знает о транспорте"
            - pkg: github.com/jackc/pgx
              desc: "порт возвращает значения домена, а не строки драйвера"

        # Use-cases собирают сценарии через порты. Прямой вызов адаптера
        # лишает сценарий возможности подменить его в тесте.
        usecase:
          files:
            - "**/internal/ingest/**"
            - "**/internal/search/**"
            - "**/internal/access/**"
            - "**/internal/docs/**"
            - "**/internal/jobs/**"
          deny:
            - pkg: github.com/kbsearch/kb/internal/store
              desc: "use-case работает через порты; прямой импорт адаптера — нарушение слоёв"
            - pkg: github.com/kbsearch/kb/internal/api
              desc: "use-case не знает о HTTP: транспорт — задача internal/api"

        # Транспорт получает готовые сценарии и не знает, чем реализован поиск.
        transport:
          files:
            - "**/internal/api/**"
          deny:
            - pkg: github.com/kbsearch/kb/internal/store
              desc: "транспорт собирает зависимости через use-cases, а не импортирует адаптеры напрямую"

        # Адаптеры реализуют порты и не вызывают сценарии: иначе появляется цикл.
        store:
          files:
            - "**/internal/store/**"
          deny:
            - pkg: github.com/kbsearch/kb/internal/api
              desc: "адаптер не знает о транспортном слое"
            - pkg: github.com/kbsearch/kb/internal/search
              desc: "адаптер реализует порты, а не вызывает сценарии: иначе появляется цикл"
            - pkg: github.com/kbsearch/kb/internal/access
              desc: "адаптер реализует порты, а не вызывает сценарии: иначе появляется цикл"
            - pkg: github.com/kbsearch/kb/internal/ingest
              desc: "адаптер реализует порты, а не вызывает сценарии: иначе появляется цикл"
            - pkg: github.com/kbsearch/kb/internal/docs
              desc: "адаптер реализует порты, а не вызывает сценарии: иначе появляется цикл"
            - pkg: github.com/kbsearch/kb/internal/jobs
              desc: "адаптер реализует порты, а не вызывает сценарии: иначе появляется цикл"

  exclusions:
    paths:
      # Черновик локальной проверки, в git не отслеживается (см. .gitignore).
      - tmp-ping/
    rules:
      # Код, сгенерированный из OpenAPI, — не наш; правила к нему не применяем.
      - path: api/api.gen.go
        linters:
          - errcheck
          - govet
          - staticcheck
          - unused
      # Тесты вправе импортировать инфраструктуру: интеграционный тест
      # проверяет адаптер так же, как его вызывает прод-код.
      - path: _test\.go
        linters:
          - depguard

formatters:
  enable:
    - gofmt
    - goimports
