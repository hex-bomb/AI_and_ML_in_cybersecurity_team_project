# Генерация Go-типов из contracts/openapi.json.
#
# Направление строго одностороннее: спецификация — источник истины, код из неё
# порождается. Обратная генерация (Go -> OpenAPI) не используется намеренно:
# FastAPI-специфичные HTTPValidationError/ValidationError и имена вида
# Body_upload_document_... воспроизводятся генератором не полностью, а фронт
# уже сгенерирован по текущему файлу.
#
# Правило изменений: сначала правится contracts/openapi.json, потом запускается
# `make contract`. `make contract-check` падает при расхождении.
#
# Спецификация лежит в корне репозитория, а не рядом с модулем, поэтому путь из
# backend/go — ../../contracts/openapi.json.
package: contracts

# Спецификация — единственный источник истины по контракту. В oapi-codegen
# v2.8.0 путь к ней НЕ часть конфига: ключа `input` в схеме нет, файл
# передаётся позиционным аргументом (см. target `contract` в Makefile).
# Спецификация лежит в корне репозитория, из backend/go это ../../contracts.
output: internal/contracts/api.gen.go

generate:
  models: true
  chi-server: true
  strict-server: true

output-options:
  skip-prune: false
  # Локальная копия шаблона strict-сервера с исправлением невалидного
  # получателя метода у пустой схемы `{}`. Копия нужна, потому что править
  # сгенерированный код нельзя, а upstream-баг иначе не обойти: см. комментарий
  # внутри шаблона. `make contract-template-diff` показывает расхождение с
  # upstream при обновлении генератора.
  user-templates:
    # Ключ обязан совпадать с именем шаблона внутри генератора: t.New(name)
    # регистрирует переопределение под этим именем. Без префикса strict/
    # шаблон подменит другой (с таким же именем) файл и strict-сервер соберётся из
    # непропатченного upstream.
    strict/strict-interface.tmpl: internal/contracts/templates/strict-interface.tmpl
