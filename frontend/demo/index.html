<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ВЕКТОР — промышленная техника</title>
  <meta name="description"
    content="Поставка строительной и промышленной техники. Демонстрация внедрения веб-виджета чата одним скриптом." />
</head>

<body>
  <div id="root"></div>
  <!--
      Настройки виджета объявляются ДО подключения загрузчика: скрипт async
      читает window.AKS_WIDGET в момент своего запуска.

      На боевом сайте это делает страница-хост ровно так же:
        window.AKS_WIDGET = {
          src: "https://cdn.example.com/aks/widget.html",
          apiUrl: "https://search.example/api/v1",
          kbId: "…",
        }

      `src` указывает на собранный виджет, который демо отдаёт как обычную
      статику из /aks — ровно как его отдавал бы внешний CDN. Исходники и
      модули виджета в сборку демо не попадают.
    -->
  <script>
    window.AKS_WIDGET = {
      src: "/aks/widget.html",
      apiUrl: "http://localhost:8000/api/v1",
      kbId: "74ade984-591f-4382-a051-ef1898855868",
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
  <!-- Виджет подключается ровно так же, как на любом внешнем сайте. -->
  <script src="/aks-widget.js" async></script>
</body>

</html>
