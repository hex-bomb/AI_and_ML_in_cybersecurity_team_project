name: ci

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/**"
      - "contracts/**"
      - "infra/**"
      - "docs/**"
      - "scripts/**"
      - ".semgrep/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/ci.yml"
      - "Makefile"
      - "ruff.toml"
      - ".pre-commit-config.yaml"
  pull_request:
    paths:
      - "apps/**"
      - "contracts/**"
      - "infra/**"
      - "docs/**"
      - "scripts/**"
      - ".semgrep/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/ci.yml"
      - "Makefile"
      - "ruff.toml"
      - ".pre-commit-config.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Зависимости тестов — те же, что в apps/backend/answer/pyproject.toml.
      - run: >-
          pip install ruff==0.6.9 pytest==8.3.3 pyyaml==6.0.2 fastapi==0.115.0
          httpx==0.27.2 "pyjwt[crypto]==2.9.0" prometheus-client==0.21.0
          python-multipart==0.0.9 "psycopg[binary]==3.3.7" psycopg-pool==3.3.3
      - run: ruff check apps/backend infra/scripts
      - run: ruff format --check apps/backend infra/scripts
      - run: python -m pytest apps/backend/answer/tests -q
      - run: python -m pytest apps/backend/ingest/tests -q
      - run: python scripts/check-contracts.py

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend/retrieval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...

  java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, documents]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q test package
        working-directory: apps/backend/${{ matrix.service }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements-docs.txt
      - run: mkdocs build --strict -f docs/mkdocs.yml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Без пина: 1.94.0 падает на Python 3.12 раннера при импорте opentelemetry.
      - run: pip install semgrep
      - run: semgrep --config .semgrep --severity=ERROR --error --metrics=off

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
