name: vektor

x-java-env: &java-env
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vektor
      POSTGRES_DB: vektor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vektor-dev}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vektor"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 30
    mem_limit: 1g

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/ds.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
      - ./infra/grafana/provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ./infra/grafana/vektor.json:/var/lib/grafana/dashboards/vektor.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  auth:
    build: apps/backend/auth
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vektor_auth
      SPRING_DATASOURCE_USERNAME: vektor
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vektor-dev}
      SPRING_PROFILES_ACTIVE: dev   # сиды демо-пользователей (user/employee/admin)
      AUTH_SIGNING_KEY_B64: ${AUTH_SIGNING_KEY_B64:-}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  documents:
    build: apps/backend/documents
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vektor_docs
      SPRING_DATASOURCE_USERNAME: vektor
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vektor-dev}
      KAFKA_BOOTSTRAP: kafka:9092
      JWKS_URL: http://auth:8080/.well-known/jwks.json
      DOCUMENTS_INTERNAL_TOKEN: ${DOCUMENTS_INTERNAL_TOKEN:-}
      DOCUMENTS_BLOB_DIR: /data/blobs
    volumes:
      # Оригиналы документов: без этого тома backup базы неполный.
      - docs-blobs:/data/blobs
    ports:
      - "127.0.0.1:18081:8080"   # /internal/* для заливки корпуса
      - "127.0.0.1:8082:8080"    # swagger-ui
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  retrieval:
    build: apps/backend/retrieval
    environment:
      ES_URL: http://elasticsearch:9200
      EMBEDDING_URL: http://embedding:8000
      JWKS_URL: http://auth:8080/.well-known/jwks.json
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  answer:
    build: apps/backend/answer
    environment:
      ANSWER_DATABASE_URL: postgresql://vektor:${POSTGRES_PASSWORD:-vektor-dev}@postgres:5432/vektor_answer
      RETRIEVAL_URL: http://retrieval:8080
      EMBEDDING_URL: http://embedding:8000
      DOCUMENTS_URL: http://documents:8080
      JWKS_URL: http://auth:8080/.well-known/jwks.json
      DOCUMENTS_INTERNAL_TOKEN: ${DOCUMENTS_INTERNAL_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-}
    ports:
      - "127.0.0.1:8083:8000"   # FastAPI /docs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 15

  embedding:
    build: apps/backend/embedding
    environment:
      MODEL_PATH: /models/model.onnx
      TOKENIZER_PATH: /models/tokenizer.json
    volumes:
      - ./apps/backend/embedding/models:/models:ro
    ports:
      - "127.0.0.1:8084:8000"   # FastAPI /docs
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 15

  ingest:
    build: apps/backend/ingest
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ES_URL: http://elasticsearch:9200
      DOCUMENTS_URL: http://documents:8080
      EMBEDDING_URL: http://embedding:8000
      DOCUMENTS_INTERNAL_TOKEN: ${DOCUMENTS_INTERNAL_TOKEN:-}
    ports:
      - "127.0.0.1:8085:8000"   # FastAPI /docs
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 20

  frontend:
    build: apps/frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  router:
    image: nginx:1.29-alpine
    depends_on:
      - auth
      - documents
      - retrieval
      - answer
      - frontend
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:5173:80"
    volumes:
      - ./infra/nginx/router.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pg-data:
  es-data:
  kafka-data:
  docs-blobs:
