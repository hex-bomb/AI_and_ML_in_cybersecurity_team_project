# Единый вход стенда.
# Синтаксис: `location = ...` — Exact, `location ^~ ...` — Prefix.
# scripts/check-contracts.py парсит эти блоки и сверяет с OpenAPI.

limit_req_zone $binary_remote_addr zone=main:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;

# keepalive к апстримам: без пула nginx открывает TCP (и TLS до сервисов нет,
# но три рукопожатия есть) на каждый запрос. При росте rps это упирается
# в source ports и даёт хвост latency.
upstream auth_up {
    server auth:8080;
    keepalive 64;
}

upstream documents_up {
    server documents:8080;
    keepalive 64;
}

upstream retrieval_up {
    server retrieval:8080;
    keepalive 64;
}

upstream answer_up {
    server answer:8000;
    keepalive 64;
}

upstream frontend_up {
    server frontend:80;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 8m;
    proxy_read_timeout 120s;
    proxy_connect_timeout 5s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    limit_req zone=main burst=40 nodelay;
    limit_req_status 429;

    location = /.well-known/jwks.json {
        proxy_pass http://auth_up;
    }

    location = /api/v1/auth/login {
        limit_req zone=login burst=4 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_pass http://auth_up;
    }

    location ^~ /api/v1/auth {
        proxy_pass http://auth_up;
    }

    location = /api/v1/search {
        proxy_pass http://retrieval_up;
    }

    location ^~ /api/v1/answers {
        proxy_pass http://answer_up;
    }

    location ^~ /api/v1/documents {
        proxy_pass http://documents_up;
    }

    location / {
        proxy_pass http://frontend_up;
    }
}
