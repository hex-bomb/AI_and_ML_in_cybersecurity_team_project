# Единый вход стенда.
# Синтаксис: `location = ...` — Exact, `location ^~ ...` — Prefix.
# scripts/check-contracts.py парсит эти блоки и сверяет с OpenAPI.

limit_req_zone $binary_remote_addr zone=main:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 8m;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    limit_req zone=main burst=40 nodelay;
    limit_req_status 429;

    location = /.well-known/jwks.json {
        proxy_pass http://auth:8080;
    }

    location = /api/v1/auth/login {
        limit_req zone=login burst=4 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_pass http://auth:8080;
    }

    location ^~ /api/v1/auth {
        proxy_pass http://auth:8080;
    }

    location = /api/v1/search {
        proxy_pass http://retrieval:8080;
    }

    location ^~ /api/v1/answers {
        proxy_pass http://answer:8000;
    }

    location ^~ /api/v1/documents {
        proxy_pass http://documents:8080;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
