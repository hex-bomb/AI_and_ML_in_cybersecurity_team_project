# Развёртывание стадии A (PoC/MVP) по схеме kb-architecture.drawio, стр. 1.
#
# Одна ВМ, Docker Compose, наружу открыты только 80/443 (Caddy). Профили:
#   core    — то, без чего система не работает: postgres, elasticsearch,
#             clickhouse, minio, keycloak, kb-api, kb-worker, caddy, tei-embed
#   ml      — tei-rerank, ollama, tika (необязательные)
#   ops     — prometheus, grafana, loki, promtail, alertmanager, backup
#   phase2  — очереди, которые появляются на стадии C
#
# Запуск:
#   cp deploy/.env.example deploy/.env && заполнить секреты
#   docker compose --env-file deploy/.env -f deploy/compose.yaml --profile core --profile ml up -d
#
# Порядок старта задан depends_on + healthcheck: postgres → keycloak,
# clickhouse, elasticsearch, minio, tei-embed → kb migrate → kb-api,
# kb-worker → caddy.
#
# Секреты и адреса — только из deploy/.env (в репозитории лежит .env.example).
# Якоря и merge-ключи здесь намеренно не используются: несколько якорей с
# пересекающимися ключами compose склеивает неоднозначно, а читаемость
# сервиса целиком важнее экономии тридцати строк.

name: kb

# ── Данные ───────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    profiles: [core]
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: kb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB: keycloak
      KC_USER: keycloak
      KC_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    env_file:
      - path: .env
        required: true
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    logging: &json-logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d kb"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    profiles: [core]
    restart: unless-stopped
    # Из схемы, стр. 1: ES 4 ГБ, из них половина — heap.
    mem_limit: 4g
    mem_reservation: 2g
    environment:
      discovery.type: single-node
      # Внутри одной ВМ отдельные контейнеры не связаны TLS, поэтому доступ
      # приложения к ES — по API-ключу, а сам ES наружу не выставлен.
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: -Xms2g -Xmx2g
      ELASTIC_PASSWORD: ${ES_PASSWORD}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: [core]
    restart: unless-stopped
    mem_limit: 2g
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-kb}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-kb}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    env_file:
      - path: .env
        required: true
    volumes:
      - ch-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    profiles: [core]
    restart: unless-stopped
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kb}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    env_file:
      - path: .env
        required: true
    volumes:
      - minio-data:/data
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: [core]
    restart: unless-stopped
    mem_limit: 1g
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *json-logging
    healthcheck:
      # В образе Keycloak нет curl и wget, поэтому проверка идёт через
      # управляющий порт 9000 обычным bash-редиректом.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

# ── Приложение ───────────────────────────────────────────────────────────

  migrate:
    build:
      context: ../backend/go
      dockerfile: Dockerfile
    image: kb:1.0
    profiles: [core]
    restart: "no"
    command: ["-mode=migrate"]
    env_file:
      - path: .env
        required: true
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/kb?sslmode=disable
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY}
      CLICKHOUSE_URL: http://clickhouse:8123
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-kb}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: kb-raw
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      minio: { condition: service_healthy }

  kb-api:
    build:
      context: ../backend/go
      dockerfile: Dockerfile
    image: kb:1.0
    profiles: [core]
    restart: unless-stopped
    mem_limit: 512m
    command: ["-mode=api"]
    env_file:
      - path: .env
        required: true
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: "0.0.0.0:8081"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/kb?sslmode=disable
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY}
      CLICKHOUSE_URL: http://clickhouse:8123
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-kb}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: kb-raw
      TEI_EMBED_URL: http://tei-embed:80
      TIKA_URL: http://tika:9998
      OLLAMA_URL: http://ollama:11434
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-kb-api}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL}
    depends_on:
      migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kb-worker:
    build:
      context: ../backend/go
      dockerfile: Dockerfile
    image: kb:1.0
    profiles: [core]
    restart: unless-stopped
    mem_limit: 768m
    command: ["-mode=worker"]
    env_file:
      - path: .env
        required: true
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: "0.0.0.0:8082"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/kb?sslmode=disable
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY}
      CLICKHOUSE_URL: http://clickhouse:8123
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-kb}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: kb-raw
      TEI_EMBED_URL: http://tei-embed:80
      TIKA_URL: http://tika:9998
      OLLAMA_URL: http://ollama:11434
    depends_on:
      migrate: { condition: service_completed_successfully }
      elasticsearch: { condition: service_healthy }
      tei-embed: { condition: service_healthy }
    logging: *json-logging
    healthcheck:
      # Воркер не обслуживает API, но по схеме отдаёт /healthz и /metrics —
      # иначе Docker и любой оркестратор считают его упавшим.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  caddy:
    image: caddy:2.8-alpine
    profiles: [core]
    restart: unless-stopped
    mem_limit: 128m
    # Наружу открыты только 80/443 — так предписывает схема.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web-dist:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      kb-api: { condition: service_healthy }
    logging: *json-logging

# ── ML (профиль ml) ──────────────────────────────────────────────────────

  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    profiles: [core, ml]
    restart: unless-stopped
    mem_limit: 3g
    environment:
      # Из схемы: BAAI/bge-m3 — 1024 измерения, мультиязычная, ctx 8192.
      MODEL_ID: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      HF_HOME: /models
    volumes:
      - models-data:/models
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    profiles: [ml]
    restart: unless-stopped
    mem_limit: 3g
    command: ["--model-id", "${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}"]
    environment:
      HF_HOME: /models
    volumes:
      - models-data:/models
    logging: *json-logging

  ollama:
    image: ollama/ollama:0.5.3
    profiles: [ml]
    restart: unless-stopped
    mem_limit: 7g
    volumes:
      - ollama-data:/root/.ollama
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  tika:
    image: apache/tika:3.1.0.0-full
    profiles: [ml]
    restart: unless-stopped
    mem_limit: 1g
    # Профиль docs по схеме: PDF/DOCX/PPTX → текст.
    command: ["--port=9998", "-h", "0.0.0.0"]
    logging: *json-logging

# ── Наблюдаемость и backup (профиль ops) ─────────────────────────────────

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: [ops]
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    logging: *json-logging

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [ops]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${KEYCLOAK_INTERNAL_URL}/realms/kb/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${KEYCLOAK_INTERNAL_URL}/realms/kb/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: ${KEYCLOAK_INTERNAL_URL}/realms/kb/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "resource_access.grafana.roles[*]"
      GF_AUTH_GENERIC_OAUTH_ROLE_PREFIX: "grafana-"
    env_file:
      - path: .env
        required: true
    volumes:
      - grafana-data:/var/lib/grafana
    logging: *json-logging

  loki:
    image: grafana/loki:3.3.2
    profiles: [ops]
    restart: unless-stopped
    mem_limit: 512m
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    logging: *json-logging

  promtail:
    image: grafana/promtail:3.3.2
    profiles: [ops]
    restart: unless-stopped
    mem_limit: 256m
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *json-logging

  alertmanager:
    image: prom/alertmanager:v0.28.0
    profiles: [ops]
    restart: unless-stopped
    mem_limit: 256m
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - am-data:/alertmanager
    logging: *json-logging

  backup:
    build:
      context: ../backend/go
      dockerfile: Dockerfile
    image: kb:1.0
    profiles: [ops]
    restart: unless-stopped
    mem_limit: 512m
    # По схеме: pg_dump (kb + keycloak), clickhouse-backup во внешний S3,
    # mc mirror бакета kb-raw. Elasticsearch не бэкапим: он пересобирается
    # из lake командой -mode=reindex.
    command: ["-mode=backup"]
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/kb?sslmode=disable
      KEYCLOAK_DB_URL: postgresql://keycloak:${KEYCLOAK_DB_PASSWORD}@postgres:5432/keycloak?sslmode=disable
      CLICKHOUSE_URL: http://clickhouse:8123
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-kb}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: kb-raw
      BACKUP_RESTIC_REPOSITORY: ${BACKUP_RESTIC_REPOSITORY:-}
      BACKUP_RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:-}
    volumes:
      - ./backup:/app/deploy/backup:ro
      - backup-data:/backup
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    logging: *json-logging

volumes:
  pg-data:
  es-data:
  ch-data:
  minio-data:
  models-data:
  ollama-data:
  prom-data:
  grafana-data:
  loki-data:
  am-data:
  backup-data:
  caddy-data:
  caddy-config:
  web-dist:
