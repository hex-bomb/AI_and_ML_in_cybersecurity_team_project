server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: vektor-documents
  config:
    # Без импорта Spring Cloud Vault не читает spring.cloud.vault.*
    import: optional:vault://
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vektor_docs}
    username: ${SPRING_DATASOURCE_USERNAME:vektor}
    password: ${db.password:vektor-dev}
    hikari:
      # Пул должен быть явно задан: дефолтные 10 соединений съедают любой рост
      # параллельных чтений, не показывая причину в метриках.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
  flyway:
    enabled: true
    create-schemas: true
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      # send() пишется в request-потоке: без жёсткого предела при недоступном
      # брокере он блокирует поток до 60 с и выедает пул Tomcat.
      properties:
        enable.idempotence: true
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:200}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:3000}
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:5000}
  cloud:
    vault:
      uri: ${SPRING_CLOUD_VAULT_URI:http://localhost:8200}
      token: ${SPRING_CLOUD_VAULT_TOKEN:root}
      fail-fast: false
      kv:
        enabled: true
        backend: secret
        default-context: vektor
        backend-version: 2

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true

documents:
  topic: ${DOCUMENTS_TOPIC:documents}
  outbox-interval-ms: ${DOCUMENTS_OUTBOX_INTERVAL_MS:500}
  outbox-batch: ${DOCUMENTS_OUTBOX_BATCH:100}
  # Оригиналы и извлечённый текст. Каталог монтируется томом: без него
  # loss блобов — это потеря документов, резервная копия БД тут не поможет.
  blob-dir: ${DOCUMENTS_BLOB_DIR:/data/blobs}
  max-upload-bytes: ${MAX_UPLOAD_BYTES:5242880}
  # Предел текста, принимаемого внутренним ingest: без него один запрос
  # может занять диск и память целой базы.
  max-text-chars: ${MAX_TEXT_CHARS:2000000}
  jwks-url: ${JWKS_URL:http://auth:80/.well-known/jwks.json}
  # Общий секрет для /internal/*: входной router эти пути не маршрутизирует,
  # токен — защита приложения поверх этого.
  # Пустое значение запрещает все внутренние вызовы (fail closed).
  internal-token: ${DOCUMENTS_INTERNAL_TOKEN:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
