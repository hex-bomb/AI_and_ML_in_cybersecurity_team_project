[project]
name = "vektor-answer"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.9,<3",
    "prometheus-client>=0.21,<1",
    "python-multipart>=0.0.9,<1",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]

[tool.setuptools.packages.find]
include = ["app*"]
