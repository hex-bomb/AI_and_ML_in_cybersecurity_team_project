name: kbsearch

x-app-image: &app-image
  build:
    context: ./backend/go
    dockerfile: Dockerfile
  image: kbsearch-app:3.0

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-kb}
  ELASTICSEARCH_URL: http://elasticsearch:9200
  FILE_STORAGE_ROOT: /var/lib/kbsearch/files
  LLM_PRIMARY_BASE_URL: http://host.docker.internal:11434

x-app-env-file: &app-env-file
  - path: backend/.env
    required: false

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kb}
      POSTGRES_USER: ${POSTGRES_USER:-kb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./compose/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb} -d ${POSTGRES_DB:-kb}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3@sha256:6e158e72e1b4d29409fe0b297ce2151325de9092fb761348bb95170df93658ed
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      ingest.geoip.downloader.enabled: "false"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-59200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app-image
    command: ["-migrate"]
    environment:
      <<: *app-env
    env_file: *app-env-file
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-image
    environment:
      <<: *app-env
      API_ADDR: "0.0.0.0:8000"
    env_file: *app-env-file
    ports:
      - "127.0.0.1:${API_PORT:-8099}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - files_data:/var/lib/kbsearch/files
      - models_data:/var/lib/kbsearch/models
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *app-image
    entrypoint: ["/usr/local/bin/worker"]
    # Воркер HTTP-сервера не поднимает, поэтому унаследованный из Dockerfile
    # HEALTHCHECK на /health/live всегда падал бы (137 рестартов подряд).
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f /usr/local/bin/worker >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      <<: *app-env
    env_file: *app-env-file
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - files_data:/var/lib/kbsearch/files
      - models_data:/var/lib/kbsearch/models
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  demo:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: kbsearch-demo:1.0
    ports:
      - "127.0.0.1:${DEMO_PORT:-5174}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  elasticsearch_data:
  files_data:
  models_data:
